name: Producer Calculability Verify

on:
  push:
    branches:
      - codex/mining-producer-phase1-core
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run Producer calculability tests
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/calculability.test.ts
      - name: Run Producer financial-consolidation tests
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/financialConsolidation.test.ts
      - name: Run Producer interval-economics tests
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/intervalEconomics.test.ts
      - name: Run Producer peer-table tests
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/peerTable.test.ts
      - name: Run Producer core tests
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/phase1Core.test.ts
      - name: Run Producer stored-source tests
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/storedSource.test.ts
      - name: Build
        run: npm run build
