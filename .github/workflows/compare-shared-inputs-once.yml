name: Compare shared Corporate inputs one-shot

on:
  push:
    branches:
      - fix/compare-pre-revenue-ssot-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compare-pre-revenue-ssot-hardening
          fetch-depth: 0

      - name: Apply shared Corporate snapshot input wiring
        run: |
          python scripts/temporary/applySharedCorporateSnapshotInputs.py
          python scripts/temporary/fixSharedCorporateSnapshotInputBuild.py

      - name: Install
        run: npm install

      - name: Regression build
        run: npm run build

      - name: Commit shared Corporate inputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git add src/components/SingleStockDashboard.tsx src/components/CompareStocksDashboard.tsx src/lib/corporate/snapshotInputResolver.ts package.json
          git commit -m "Use shared Corporate snapshot input resolver"
          git push origin HEAD:fix/compare-pre-revenue-ssot-hardening
