name: One-shot corporate valuation-year wiring

on:
  push:
    branches:
      - "fix/corporate-waterfall-valuation-year-20260905"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/corporate-waterfall-valuation-year-20260905"
          fetch-depth: 0
      - name: Wire explicit valuation year
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/snapshot/runCorporateSnapshot.ts")
          text = path.read_text()
          old = "    const cashWaterfall = fxRate === null ? null : computeCorporateCashWaterfall({\n      yearsByPeriod: aggregationEffective.corporateYearsByPeriod,\n      latestQuarterlyCash:"
          new = "    const cashWaterfall = fxRate === null ? null : computeCorporateCashWaterfall({\n      yearsByPeriod: aggregationEffective.corporateYearsByPeriod,\n      valuationYear: input.valuationYear,\n      latestQuarterlyCash:"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one waterfall call anchor, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          git rm .github/workflows/one-shot-corporate-valuation-year.yml
          git add src/lib/snapshot/runCorporateSnapshot.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: pass explicit valuation year to corporate waterfall"
          git push origin HEAD:fix/corporate-waterfall-valuation-year-20260905
