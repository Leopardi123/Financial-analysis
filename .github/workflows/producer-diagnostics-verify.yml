name: Producer diagnostics verification

on:
  push:
    branches:
      - codex/mining-producer-phase1-core
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Route-aware diagnostics
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/diagnostics.test.ts
      - name: Forecast regression
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/forecast.test.ts
      - name: Interval economics regression
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/intervalEconomics.test.ts
      - name: Financial consolidation regression
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/financialConsolidation.test.ts
      - name: Live market regression
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/liveMarket.test.ts
      - name: Peer table regression
        run: node --experimental-strip-types src/lib/miningProducer/__tests__/peerTable.test.ts
      - name: Build
        run: npm run build
