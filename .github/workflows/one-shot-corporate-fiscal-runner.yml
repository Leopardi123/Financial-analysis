name: One-shot Corporate fiscal SSOT runner

on:
  push:
    branches:
      - fix/corporate-waterfall-valuation-year-20260905

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/corporate-waterfall-valuation-year-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Extract prepared patch
        run: python -c 'from pathlib import Path; s=Path(".github/workflows/one-shot-corporate-fiscal-ssot.yml").read_text(); start=s.index("          python - <<"); start=s.index("\n",start)+1; end=s.index("\n          PY\n",start); b=s[start:end]; lines=[line[10:] if line.startswith("          ") else line for line in b.splitlines()]; Path("/tmp/apply-corporate-fiscal-ssot.py").write_text("\n".join(lines)+"\n")'
      - name: Apply prepared patch
        run: python /tmp/apply-corporate-fiscal-ssot.py
      - name: Run focused regression
        run: npm run test:snapshot-cashflow
      - name: Run financing regression
        run: npm run test:corporate-financing
      - name: Run full build gate
        run: npm run build
      - name: Commit final fix
        run: |
          git rm .github/workflows/one-shot-corporate-fiscal-ssot.yml .github/workflows/one-shot-corporate-fiscal-runner.yml
          git add src/lib/snapshot/runCorporateSnapshot.ts src/lib/snapshot/__tests__/v3RuntimeTimeline.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve canonical fiscal economics in Corporate"
          git push origin HEAD:fix/corporate-waterfall-valuation-year-20260905
