name: Producer cash cost verify

on:
  push:
    branches:
      - codex/mining-producer-phase1-core
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --experimental-strip-types src/lib/miningProducer/__tests__/cashCostInterval.test.ts
      - run: node --experimental-strip-types src/lib/miningProducer/__tests__/diagnostics.test.ts
      - run: node --experimental-strip-types src/lib/miningProducer/__tests__/forecast.test.ts
      - run: node --experimental-strip-types src/lib/miningProducer/__tests__/intervalEconomics.test.ts
      - run: node --experimental-strip-types src/lib/miningProducer/__tests__/financialConsolidation.test.ts
      - run: node --experimental-strip-types src/lib/miningProducer/__tests__/liveMarket.test.ts
      - run: npm run build
