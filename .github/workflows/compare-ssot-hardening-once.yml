name: Compare SSOT hardening one-shot

on:
  push:
    branches:
      - fix/compare-pre-revenue-ssot-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compare-pre-revenue-ssot-hardening
          fetch-depth: 0

      - name: Quarantine unresolved EV / LOM Eq metric
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/CompareStocksDashboard.tsx')
          text = path.read_text()

          old_help = "['evLomAueq', `EV / LOM ${eq}`, `Enterprise value i USD inklusive Corporate cash/debt/financing bridge per canonical LOM ${eq}`],"
          new_help = "['evLomAueq', `EV / LOM ${eq}`, 'n/a — EV-definitionen är i karantän. Ingen proxy används innan separat EV-audit har låst en apples-to-apples enterprise-basis.'],"
          if old_help not in text:
              raise SystemExit('EV / LOM Eq help anchor not found')
          text = text.replace(old_help, new_help, 1)

          old_case = "case 'evLomAueq': return reference && finite(reference.evPerLomEqUSD) ? `${formatNumber(reference.evPerLomEqUSD)} USD/${unit}` : '—';"
          new_case = "case 'evLomAueq': return 'n/a';"
          if old_case not in text:
              raise SystemExit('EV / LOM Eq render anchor not found')
          text = text.replace(old_case, new_case, 1)

          path.write_text(text)
          PY

      - name: Install
        run: npm install

      - name: Regression build
        run: npm run build

      - name: Commit first hardening patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git add src/components/CompareStocksDashboard.tsx
          git commit -m "Quarantine unresolved Compare EV metric"
          git push origin HEAD:fix/compare-pre-revenue-ssot-hardening
