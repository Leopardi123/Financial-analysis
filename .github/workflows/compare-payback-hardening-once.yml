name: Compare Corporate payback hardening one-shot

on:
  push:
    branches:
      - fix/compare-pre-revenue-ssot-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compare-pre-revenue-ssot-hardening
          fetch-depth: 0

      - name: Apply source patch
        run: python scripts/temporary/applyComparePaybackHardening.py

      - name: Install
        run: npm install

      - name: Regression build
        run: npm run build

      - name: Commit payback hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git add src/lib/snapshot/runCorporateSnapshot.ts src/lib/corporate/preRevenueMetrics.ts src/lib/corporate/__tests__/preRevenueMetrics.test.ts src/lib/corporate/__tests__/preRevenueMetricsParity.test.ts
          git commit -m "Fix canonical Corporate real payback axis"
          git push origin HEAD:fix/compare-pre-revenue-ssot-hardening
