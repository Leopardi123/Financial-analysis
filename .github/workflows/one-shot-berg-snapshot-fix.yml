name: One-shot Berg snapshot fix

on:
  push:
    branches:
      - feature/berg-runtime-integration-fixes
    paths:
      - .github/workflows/one-shot-berg-snapshot-fix.yml
      - .github/scripts/apply-berg-snapshot-fix.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/berg-runtime-integration-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: python .github/scripts/apply-berg-snapshot-fix.py
      - name: Install
        run: npm install
      - name: Run focused and prebuild tests
        run: npm run prebuild
      - name: Typecheck and build
        run: npm run build
      - name: Commit patch
        run: |
          if git diff --quiet -- src/lib/snapshot/runCorporateSnapshot.ts; then
            echo "No source change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/snapshot/runCorporateSnapshot.ts
          git commit -m "Use explicit tax and terminal proceeds in snapshot FCFF"
          git push origin HEAD:feature/berg-runtime-integration-fixes
