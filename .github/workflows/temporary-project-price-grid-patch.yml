name: Temporary Project price grid patch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch grouped Project grid
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/SingleStockDashboard.tsx')
          text = path.read_text()
          marker = "const label = `Price ${metal} (USD/${unit})`;"
          if marker in text:
              print('Grouped Project price rows already patched')
              raise SystemExit(0)

          old_price = "      priceUSDByMetal: (projectSeriesRecord.priceUsedByMetal_USD as Record<string, Array<number | null>> | undefined) ?? {},"
          new_price = """      priceUSDByMetal: (() => {
            const revenueByMetal = (projectSeriesRecord.revenueByMetal_USD as Record<string, Array<number | null>> | undefined) ?? {};
            return Object.fromEntries(
              Object.entries(revenueByMetal).map(([metal, revenueSeries]) => {
                const qty = payableSeriesByMetal[metal] ?? [];
                const displayedPrice = revenueSeries.map((revenue, t) => {
                  const quantity = qty[t];
                  if (revenue === null || quantity === null || !Number.isFinite(revenue) || !Number.isFinite(quantity) || quantity === 0) return null;
                  return revenue / quantity;
                });
                return [metal, displayedPrice];
              }),
            );
          })(),"""
          if old_price not in text:
              raise SystemExit('Expected priceUSDByMetal source block not found')
          text = text.replace(old_price, new_price, 1)

          payable_block = """      ...orderedMetals.map((metal) => {
        const values = getSeries(payableSeriesByMetal[metal]);
        const unit = payableUnits[metal];
        const include = rowHasDisplayValue(values);
        return {
          label: `Payable ${metal} (${unit ?? '—'})`,
          values: include ? values : null,
        };
      }),"""
          price_block = """      ...orderedMetals.map((metal) => {
        const unit = payableUnits[metal] ?? '—';
        const label = `Price ${metal} (USD/${unit})`;
        const values = seriesByLabel.get(label) ?? null;
        if (!rowHasDisplayValue(values)) return null;
        return { label, values };
      }),"""
          if payable_block not in text:
              raise SystemExit('Expected payable production-row block not found')
          text = text.replace(payable_block, payable_block + "\n" + price_block, 1)
          path.write_text(text)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SingleStockDashboard.tsx
          git commit -m "Show prices in grouped Project grid"
          git push
