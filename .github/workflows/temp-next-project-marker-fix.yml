name: Temporary next-project marker fix

on:
  push:
    branches:
      - codex/tier1-simplify-single-source
    paths:
      - .github/workflows/temp-next-project-marker-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tier1-simplify-single-source
          fetch-depth: 0
      - name: Require a future Corporate project marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/CompareStocksDashboard.tsx')
          text = path.read_text()
          old = "  return markers.find((marker) => (markerYear(marker) ?? -Infinity) > currentYear) ?? markers[0] ?? null;"
          new = "  return markers.find((marker) => (markerYear(marker) ?? -Infinity) > currentYear) ?? null;"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one historical marker fallback, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/components/CompareStocksDashboard.tsx
      - name: Commit intended change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CompareStocksDashboard.tsx
          git commit -m "fix(compare): require future project start for rerating target"
          git push origin HEAD:codex/tier1-simplify-single-source
