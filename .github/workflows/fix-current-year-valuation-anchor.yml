name: Fix current-year valuation anchor

on:
  push:
    branches:
      - fix/producer-next-project-irr-clean

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[current-year-anchor-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/producer-next-project-irr-clean
          fetch-depth: 0
      - name: Patch valuation selection and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          valuation_path = Path('src/lib/valuation/canonicalValuationTimeline.ts')
          text = valuation_path.read_text()

          old = """    const state = timeline.periods.find((period) => period.calendarYear === project.productionStartYear);\n    if (!state) return [];\n"""
          new = """    const state = timeline.periods.find((period) => period.calendarYear === project.productionStartYear);\n    // A project start before the valuation year is historical, not a current valuation milestone.\n    if (!state || state.periodIndex < timeline.todayPeriod) return [];\n"""
          if old not in text:
              raise SystemExit('selectCorporateProjectStartMilestones patch target not found')
          text = text.replace(old, new, 1)

          old = """  const validStartPeriods = new Set(startPeriods.filter((period) => Number.isInteger(period) && timeline.periods[period]));\n  if (selectedStartPeriod !== null) validStartPeriods.add(selectedStartPeriod);\n"""
          new = """  const validStartPeriods = new Set(startPeriods.filter((period) =>\n    Number.isInteger(period) && period >= timeline.todayPeriod && timeline.periods[period]\n  ));\n  if (selectedStartPeriod !== null && timeline.productionStartPeriod === selectedStartPeriod) {\n    validStartPeriods.add(selectedStartPeriod);\n  }\n"""
          if old not in text:
              raise SystemExit('validStartPeriods patch target not found')
          text = text.replace(old, new, 1)

          old = """  const maximum = (field: 'low' | 'high'): ValuationChartPoint | null => points.reduce<ValuationChartPoint | null>((peak, point) => {\n    const value = point[field];\n"""
          new = """  const maximum = (field: 'low' | 'high'): ValuationChartPoint | null => points.reduce<ValuationChartPoint | null>((peak, point) => {\n    if (point.periodIndex < timeline.todayPeriod) return peak;\n    const value = point[field];\n"""
          if old not in text:
              raise SystemExit('maximum patch target not found')
          text = text.replace(old, new, 1)

          old = """  const valid = startPeriods\n    .filter((period) => Number.isInteger(period) && timeline.periods[period])\n"""
          new = """  const valid = startPeriods\n    .filter((period) => Number.isInteger(period) && period >= timeline.todayPeriod && timeline.periods[period])\n"""
          if old not in text:
              raise SystemExit('selectValuationStartPeriod filter target not found')
          text = text.replace(old, new, 1)

          old = """  return timeline.productionStartPeriod !== null && timeline.periods[timeline.productionStartPeriod]\n    ? timeline.productionStartPeriod\n    : null;\n"""
          new = """  return timeline.productionStartPeriod !== null\n    && timeline.productionStartPeriod >= timeline.todayPeriod\n    && timeline.periods[timeline.productionStartPeriod]\n    ? timeline.productionStartPeriod\n    : timeline.periods[timeline.todayPeriod]\n      ? timeline.todayPeriod\n      : null;\n"""
          if old not in text:
              raise SystemExit('selectValuationStartPeriod fallback target not found')
          text = text.replace(old, new, 1)

          old = """    points: selection.points.filter((point) => point.calendarYear <= chartEndYear),\n"""
          new = """    points: selection.points.filter((point) =>\n      point.periodIndex >= timeline.todayPeriod && point.calendarYear <= chartEndYear\n    ),\n"""
          if old not in text:
              raise SystemExit('display range patch target not found')
          text = text.replace(old, new, 1)
          valuation_path.write_text(text)

          test_path = Path('src/lib/snapshot/__tests__/producerNextProjectIrr.prebuild.test.ts')
          test = test_path.read_text()
          import_old = "import { runCorporateSnapshotPipeline } from '../runCorporateSnapshot.ts';\n"
          import_new = import_old + "import { selectValuationChart, selectValuationChartDisplayRange } from '../../valuation/canonicalValuationTimeline.ts';\n"
          if import_new not in test:
              if import_old not in test:
                  raise SystemExit('test import target not found')
              test = test.replace(import_old, import_new, 1)

          marker = "  console.log('producerNextProjectIrr.prebuild.test.ts passed');\n"
          block = r'''  {
    const body = await loadFixture();
    const projects = body.projects as Array<Record<string, unknown>>;
    projects.push(cloneProject(projects[0], 'ABRA_FUTURE_CURRENT_YEAR_ANCHOR'));
    setFirstModelYear(body, currentYear - 3, 0);
    setFirstModelYear(body, currentYear + 1, 1);
    body.valuationYear = currentYear;

    const result = await runCorporateSnapshotPipeline({ body, refresh: false, debug: true });
    assert.equal(result.ok, true, 'current-year valuation anchor case must compute');
    if (result.ok) {
      const snapshot = result.snapshot as any;
      const timeline = snapshot.canonicalValuationTimeline;
      const milestones = (snapshot.projectStartMilestones ?? []) as Array<{ corporatePeriodIndex: number; calendarYear: number }>;
      const startPeriods = milestones.map((milestone) => milestone.corporatePeriodIndex);
      const selection = selectValuationChart(timeline, startPeriods);
      const display = selectValuationChartDisplayRange(timeline, selection, 'corporate');
      const today = timeline.periods[timeline.todayPeriod];

      assert.equal(today.calendarYear, currentYear, 'valuation today must be the current valuation year');
      assert.equal(display.points[0]?.calendarYear, currentYear, 'chart must start at the valuation year');
      assert.equal(display.points.some((point) => point.calendarYear < currentYear), false, 'chart must not render historical years');
      assert.equal(milestones.some((milestone) => milestone.calendarYear < currentYear), false, 'historical project starts must not be current valuation milestones');
      assert.equal(today.npvAtPeriodTarget, snapshot.NPV_today_TargetCurrency, 'NPV must be anchored at valuation year');
      assert.equal(today.navAtPeriodTarget, snapshot.NAV_today_TargetCurrency, 'NAV must be anchored at valuation year');

      const shares = snapshot.financing?.shares_post_financing;
      const dcfPresent = snapshot.DCF_prodStart_present_TargetCurrency;
      if (typeof shares === 'number' && Number.isFinite(shares) && typeof dcfPresent === 'number' && Number.isFinite(dcfPresent)) {
        assert.equal(typeof selection.today.high, 'number');
        assert.ok(Math.abs((selection.today.high as number) * shares - dcfPresent) < 1e-5, 'DCF present-value display must use the same valuation-year anchor as snapshot DCF');
      }
    }
  }

'''
          if 'current-year valuation anchor case must compute' not in test:
              if marker not in test:
                  raise SystemExit('test insertion marker not found')
              test = test.replace(marker, block + marker, 1)
          test_path.write_text(test)
          PY
          rm .github/workflows/fix-current-year-valuation-anchor.yml
      - name: Commit current-year valuation anchor fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[current-year-anchor-fixed] Anchor valuation chart and DCF at current year'
          git push origin HEAD:fix/producer-next-project-irr-clean
