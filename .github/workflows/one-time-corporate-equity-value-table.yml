name: One-time Corporate equity value table

on:
  push:
    branches:
      - feat/corporate-equity-value-table-clean
    paths:
      - .github/workflows/one-time-corporate-equity-value-table.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/corporate-equity-value-table-clean
          fetch-depth: 0
      - name: Apply isolated Corporate equity value patch
        run: python scripts/one-time-corporate-equity-value-table.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Run equity-value and valuation regressions
        run: |
          node --experimental-strip-types src/lib/corporate/valuation/__tests__/corporateEquityValue.test.ts
          node --experimental-strip-types src/lib/snapshot/__tests__/producerNextProjectIrr.prebuild.test.ts
          node --experimental-strip-types src/lib/snapshot/__tests__/runCorporateSnapshot.series.test.ts
          node --experimental-strip-types src/components/project/__tests__/corporateValuationChart.integration.test.ts
      - name: Run production build
        run: npm run build
      - name: Commit implementation and remove one-time tooling
        run: |
          rm -f .github/workflows/one-time-corporate-equity-value-table.yml
          rm -f scripts/one-time-corporate-equity-value-table.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add isolated Corporate equity value table metrics'
          git push origin HEAD:feat/corporate-equity-value-table-clean
