name: Temporary Compare SSOT fix

on:
  push:
    branches:
      - codex/tier1-simplify-single-source
    paths:
      - .github/workflows/temp-compare-ssot-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tier1-simplify-single-source
          fetch-depth: 0
      - name: Apply exact SSOT and display replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          compare = Path('src/components/CompareStocksDashboard.tsx')
          text = compare.read_text()
          old_helper = '''function targetCurrencyToUsd(snapshot: SnapshotWithValuationSeries, targetCurrencyValue: number | null): number | null {\n  if (!finite(targetCurrencyValue)) return null;\n  const fx = readFinite(snapshot.fx_USD_to_TargetCurrency);\n  if (!finite(fx) || fx <= 0) return null;\n  return targetCurrencyValue / fx;\n}\n\n'''
          if text.count(old_helper) != 1:
              raise SystemExit(f'Expected one targetCurrencyToUsd helper, found {text.count(old_helper)}')
          text = text.replace(old_helper, '', 1)
          old_capex = '''  const initialCapexTargetCurrency = marker?.lista2Metrics?.InitialCAPEX_incremental_TargetCurrency ?? null;\n  const initialCapexUsd = targetCurrencyToUsd(s, initialCapexTargetCurrency);'''
          new_capex = '''  const initialCapexUsd = marker?.lista2Metrics?.InitialCAPEX_incremental_USD ?? null;'''
          if text.count(old_capex) != 1:
              raise SystemExit(f'Expected one Compare CAPEX conversion block, found {text.count(old_capex)}')
          text = text.replace(old_capex, new_capex, 1)
          compare.write_text(text)

          cost = Path('src/lib/tier1/costBenchmarkAssessment.ts')
          text = cost.read_text()
          gate = '''function gateStatus(tier: 1 | 2 | 3): 'PASS' | 'FAIL' {\n  return tier === 1 ? 'PASS' : 'FAIL';\n}\n\n'''
          replacement = gate + '''function displayCostUnit(unit: string): string {\n  return unit === 'USD/toz' ? 'USD/oz' : unit;\n}\n\n'''
          if text.count(gate) != 1:
              raise SystemExit(f'Expected one gateStatus block, found {text.count(gate)}')
          text = text.replace(gate, replacement, 1)
          needle = '''function digitisedBoundaryNote(value: number, benchmark: Tier1CostBenchmark): string {\n  const uncertainty = benchmark.boundaryUncertaintyAbs;'''
          repl = '''function digitisedBoundaryNote(value: number, benchmark: Tier1CostBenchmark): string {\n  const displayUnit = displayCostUnit(benchmark.unit);\n  const uncertainty = benchmark.boundaryUncertaintyAbs;'''
          if text.count(needle) != 1:
              raise SystemExit(f'Expected one digitisedBoundaryNote opening, found {text.count(needle)}')
          text = text.replace(needle, repl, 1)
          needle = '''  const { benchmark } = args;\n  const metricLabel = COST_METRIC_LABELS[args.metric];'''
          repl = '''  const { benchmark } = args;\n  const displayUnit = displayCostUnit(benchmark.unit);\n  const metricLabel = COST_METRIC_LABELS[args.metric];'''
          if text.count(needle) != 1:
              raise SystemExit(f'Expected one assessment benchmark block, found {text.count(needle)}')
          text = text.replace(needle, repl, 1)
          count = text.count('${benchmark.unit}')
          if count < 5:
              raise SystemExit(f'Expected multiple benchmark unit display interpolations, found {count}')
          text = text.replace('${benchmark.unit}', '${displayUnit}')
          cost.write_text(text)
          PY
          git diff --check
          git diff -- src/components/CompareStocksDashboard.tsx src/lib/tier1/costBenchmarkAssessment.ts
      - name: Commit intended changes
        run: |
          if git diff --quiet -- src/components/CompareStocksDashboard.tsx src/lib/tier1/costBenchmarkAssessment.ts; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CompareStocksDashboard.tsx src/lib/tier1/costBenchmarkAssessment.ts
          git commit -m "fix(compare): use canonical USD CAPEX and display oz units"
          git push origin HEAD:codex/tier1-simplify-single-source
