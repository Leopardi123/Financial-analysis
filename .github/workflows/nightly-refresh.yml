name: Finalize Direct Project Price Rows
on: [push]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/corporate-pre-revenue-metrics
          fetch-depth: 0
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/SingleStockDashboard.tsx')
          s = p.read_text()
          old = "        priceUSDByMetal: (projectSeriesRecord.priceUsedByMetal_USD as Record<string, Array<number | null>> | undefined) ?? {},"
          new = """        // priceUsedByMetal_USD may use a different source-key unit than the
        // displayed payable quantity. Derive the display-unit price from the
        // canonical snapshot revenue identity instead of multiplying mismatched units.
        priceUSDByMetal: (() => {
          const revenueByMetal = (projectSeriesRecord.revenueByMetal_USD as Record<string, Array<number | null>> | undefined) ?? {};
          return Object.fromEntries(
            Object.entries(revenueByMetal).map(([metal, revenueSeries]) => {
              const payableSeries = payableSeriesByMetal[metal] ?? [];
              return [metal, revenueSeries.map((revenue, t) => {
                const quantity = payableSeries[t];
                if (typeof revenue !== 'number' || !Number.isFinite(revenue) || typeof quantity !== 'number' || !Number.isFinite(quantity) || quantity === 0) return null;
                return revenue / quantity;
              })];
            }),
          );
        })(),"""
          if old not in s:
              raise SystemExit('price anchor not found')
          s = s.replace(old, new, 1)
          payable = """      ...orderedMetals.map((metal) => {
        const values = getSeries(payableSeriesByMetal[metal]);
        const unit = payableUnits[metal];
        const include = rowHasDisplayValue(values);
        return {
          label: `Payable ${metal} (${unit ?? '—'})`,
          values: include ? values : null,
        };
      }),"""
          prices = """      ...orderedMetals.map((metal) => {
        const unit = payableUnits[metal] ?? '—';
        const label = `Price ${metal} (USD/${unit})`;
        const values = seriesByLabel.get(label) ?? null;
        if (!rowHasDisplayValue(values)) return null;
        return { label, values };
      }),"""
          if payable not in s:
              raise SystemExit('payable anchor not found')
          p.write_text(s.replace(payable, payable + '\n' + prices, 1))
          Path('vite.config.ts').write_text('import { defineConfig } from "vite";\nimport react from "@vitejs/plugin-react";\n\nexport default defineConfig({\n  plugins: [react()],\n});\n')
          PY
      - name: Build and test
        run: |
          npm ci
          npm run test:investment-score
          npm run test:project-grid
          npm run test:pre-revenue-corporate
          npm run build
      - name: Commit final source form
        run: |
          cat > .github/workflows/nightly-refresh.yml <<'EOF'
          name: Nightly Refresh (Disabled)

          # Scheduling handled by Vercel Cron (vercel.json).
          on: []

          jobs:
            refresh:
              runs-on: ubuntu-latest
              steps:
                - name: Workflow disabled
                  run: echo "Nightly refresh scheduling is handled by Vercel Cron."
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SingleStockDashboard.tsx vite.config.ts .github/workflows/nightly-refresh.yml
          git commit -m "Move Project price rows into dashboard source"
          git push origin HEAD:feature/corporate-pre-revenue-metrics
