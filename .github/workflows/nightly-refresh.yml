name: Project Price Direct Source Finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/corporate-pre-revenue-metrics
          fetch-depth: 0

      - name: Move Project price rows into SingleStockDashboard source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/SingleStockDashboard.tsx')
          s = p.read_text()

          old_price = "        priceUSDByMetal: (projectSeriesRecord.priceUsedByMetal_USD as Record<string, Array<number | null>> | undefined) ?? {},"
          new_price = """        // priceUsedByMetal_USD may use a different source-key unit than the
        // displayed payable quantity. Derive the display-unit price from the
        // canonical snapshot revenue identity instead of multiplying mismatched units.
        priceUSDByMetal: (() => {
          const revenueByMetal = (projectSeriesRecord.revenueByMetal_USD as Record<string, Array<number | null>> | undefined) ?? {};
          return Object.fromEntries(
            Object.entries(revenueByMetal).map(([metal, revenueSeries]) => {
              const payableSeries = payableSeriesByMetal[metal] ?? [];
              return [metal, revenueSeries.map((revenue, t) => {
                const quantity = payableSeries[t];
                if (
                  typeof revenue !== 'number'
                  || !Number.isFinite(revenue)
                  || typeof quantity !== 'number'
                  || !Number.isFinite(quantity)
                  || quantity === 0
                ) return null;
                return revenue / quantity;
              })];
            }),
          );
        })(),"""
          if old_price not in s:
              raise SystemExit('price source anchor not found')
          s = s.replace(old_price, new_price, 1)

          payable = """      ...orderedMetals.map((metal) => {
        const values = getSeries(payableSeriesByMetal[metal]);
        const unit = payableUnits[metal];
        const include = rowHasDisplayValue(values);
        return {
          label: `Payable ${metal} (${unit ?? '—'})`,
          values: include ? values : null,
        };
      }),"""
          price_rows = """      ...orderedMetals.map((metal) => {
        const unit = payableUnits[metal] ?? '—';
        const label = `Price ${metal} (USD/${unit})`;
        const values = seriesByLabel.get(label) ?? null;
        if (!rowHasDisplayValue(values)) return null;
        return { label, values };
      }),"""
          if payable not in s:
              raise SystemExit('payable row anchor not found')
          s = s.replace(payable, payable + '\n' + price_rows, 1)
          p.write_text(s)

          Path('vite.config.ts').write_text('''import { defineConfig } from "vite";\nimport react from "@vitejs/plugin-react";\n\nexport default defineConfig({\n  plugins: [react()],\n});\n''')
          PY

      - name: Verify no source transform remains
        shell: bash
        run: |
          grep -Fq 'const label = `Price ${metal} (USD/${unit})`;' src/components/SingleStockDashboard.tsx
          grep -Fq 'return revenue / quantity;' src/components/SingleStockDashboard.tsx
          ! grep -q 'grouped-project-price-rows-patch' vite.config.ts
          ! grep -q 'groupedProjectPriceRowsPatch' vite.config.ts

      - name: Run regression gates
        run: |
          npm ci
          npm run test:investment-score
          npm run test:project-grid
          npm run test:pre-revenue-corporate
          npm run build

      - name: Commit direct source implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SingleStockDashboard.tsx vite.config.ts
          git commit -m "Move Project price rows into dashboard source"
          git push origin HEAD:feature/corporate-pre-revenue-metrics
