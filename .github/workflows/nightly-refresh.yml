name: Finalize Direct Project Price Rows

on:
  push:
    branches:
      - feature/corporate-pre-revenue-metrics

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/corporate-pre-revenue-metrics
          fetch-depth: 0

      - name: Patch direct source and remove temporary scaffolding
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dashboard = Path('src/components/SingleStockDashboard.tsx')
          text = dashboard.read_text()

          old_price = "        priceUSDByMetal: (projectSeriesRecord.priceUsedByMetal_USD as Record<string, Array<number | null>> | undefined) ?? {},"
          new_price = """        // priceUsedByMetal_USD may use a different source-key unit than the
        // displayed payable quantity. Derive the display-unit price from the
        // canonical snapshot revenue identity instead of multiplying mismatched units.
        priceUSDByMetal: (() => {
          const revenueByMetal = (projectSeriesRecord.revenueByMetal_USD as Record<string, Array<number | null>> | undefined) ?? {};
          return Object.fromEntries(
            Object.entries(revenueByMetal).map(([metal, revenueSeries]) => {
              const payableSeries = payableSeriesByMetal[metal] ?? [];
              return [metal, revenueSeries.map((revenue, t) => {
                const quantity = payableSeries[t];
                if (
                  typeof revenue !== 'number'
                  || !Number.isFinite(revenue)
                  || typeof quantity !== 'number'
                  || !Number.isFinite(quantity)
                  || quantity === 0
                ) return null;
                return revenue / quantity;
              })];
            }),
          );
        })(),"""
          if old_price not in text:
              raise SystemExit('direct price source anchor not found')
          text = text.replace(old_price, new_price, 1)

          payable_block = """      ...orderedMetals.map((metal) => {
        const values = getSeries(payableSeriesByMetal[metal]);
        const unit = payableUnits[metal];
        const include = rowHasDisplayValue(values);
        return {
          label: `Payable ${metal} (${unit ?? '—'})`,
          values: include ? values : null,
        };
      }),"""
          price_rows = """      ...orderedMetals.map((metal) => {
        const unit = payableUnits[metal] ?? '—';
        const label = `Price ${metal} (USD/${unit})`;
        const values = seriesByLabel.get(label) ?? null;
        if (!rowHasDisplayValue(values)) return null;
        return { label, values };
      }),"""
          if payable_block not in text:
              raise SystemExit('direct payable-row anchor not found')
          text = text.replace(payable_block, payable_block + '\n' + price_rows, 1)
          dashboard.write_text(text)

          Path('vite.config.ts').write_text('''import { defineConfig } from "vite";\nimport react from "@vitejs/plugin-react";\n\nexport default defineConfig({\n  plugins: [react()],\n});\n''')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package.get('scripts', {}).pop('postinstall', None)
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')

          helper = Path('scripts/finalize-project-price-source.mjs')
          if helper.exists():
              helper.unlink()

          metrics = Path('src/lib/corporate/preRevenueMetrics.ts')
          metrics_text = metrics.read_text()
          alias = """export type CorporateSnapshotWithValuationSeries = CorporateSnapshot & {
  corporateValuationTimeSeries?: {
    rows?: Array<{ year?: number; evEbitda6xPerShare?: number | null }>;
  };
};

"""
          if alias in metrics_text:
              metrics.write_text(metrics_text.replace(alias, '', 1))
          PY

      - name: Verify direct-source state
        shell: bash
        run: |
          grep -Fq 'const label = `Price ${metal} (USD/${unit})`;' src/components/SingleStockDashboard.tsx
          grep -Fq 'return revenue / quantity;' src/components/SingleStockDashboard.tsx
          ! grep -q 'grouped-project-price-rows-patch' vite.config.ts
          ! grep -q 'groupedProjectPriceRowsPatch' vite.config.ts
          ! grep -q 'finalize-project-price-source' package.json
          ! test -e scripts/finalize-project-price-source.mjs
          ! grep -q 'CorporateSnapshotWithValuationSeries' src/lib/corporate/preRevenueMetrics.ts
          git diff --check

      - name: Install and run full build gates
        run: |
          npm ci
          npm run build

      - name: Restore disabled workflow and commit final source implementation
        shell: bash
        run: |
          cat > .github/workflows/nightly-refresh.yml <<'EOF'
          name: Nightly Refresh (Disabled)

          # Scheduling handled by Vercel Cron (vercel.json).
          on: []

          jobs:
            refresh:
              runs-on: ubuntu-latest
              steps:
                - name: Workflow disabled
                  run: echo "Nightly refresh scheduling is handled by Vercel Cron."
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/SingleStockDashboard.tsx \
            vite.config.ts \
            package.json \
            src/lib/corporate/preRevenueMetrics.ts \
            .github/workflows/nightly-refresh.yml
          git add -u scripts/finalize-project-price-source.mjs || true
          git commit -m "Finalize direct Project price rows"
          git push origin HEAD:feature/corporate-pre-revenue-metrics
