name: Temporary Financing Provenance Repair

on:
  push:
    branches:
      - feature/corporate-pre-revenue-metrics

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/corporate-pre-revenue-metrics
          fetch-depth: 0

      - name: Add provenance to FX-missing financing fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/snapshot/runCorporateSnapshot.ts')
          s = p.read_text()
          old = """    const financing = fxRate === null
      ? {
          cash_used_for_build_TargetCurrency: null,
"""
          new = """    const financing = fxRate === null
      ? {
          financing_provenance: {
            debt_fraction: input.financingPlan?.debt_fraction == null ? 'DEFAULT' as const : 'USER' as const,
            equity_fraction: input.financingPlan?.equity_fraction == null ? 'DEFAULT' as const : 'USER' as const,
            use_cash_first: input.financingPlan?.use_cash_first == null ? 'DEFAULT' as const : 'USER' as const,
            cash_use_percent: input.financingPlan?.cash_use_percent == null ? 'DEFAULT' as const : 'USER' as const,
            canonical_default_split_applied:
              input.financingPlan?.debt_fraction == null && input.financingPlan?.equity_fraction == null,
          },
          remaining_funding_need_TargetCurrency: null,
          cash_used_for_build_TargetCurrency: null,
"""
          if old not in s:
              raise SystemExit('financing fallback anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Install, financing test and full build
        run: |
          npm install
          npm run test:corporate-financing
          npm run build

      - name: Restore disabled workflow and commit repair
        shell: bash
        run: |
          cat > .github/workflows/nightly-refresh.yml <<'EOF'
          name: Nightly Refresh (Disabled)

          # Scheduling handled by Vercel Cron (vercel.json).
          on: []

          jobs:
            refresh:
              runs-on: ubuntu-latest
              steps:
                - name: Workflow disabled
                  run: echo "Nightly refresh scheduling is handled by Vercel Cron."
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/snapshot/runCorporateSnapshot.ts .github/workflows/nightly-refresh.yml
          git commit -m "Preserve financing provenance in snapshot fallbacks"
          git push origin HEAD:feature/corporate-pre-revenue-metrics
