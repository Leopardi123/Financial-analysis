name: Temporary Financing Provenance Repair
on: push
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/corporate-pre-revenue-metrics
          fetch-depth: 0
      - name: Patch snapshot fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/snapshot/runCorporateSnapshot.ts')
          s = p.read_text()
          old = "    const financing = fxRate === null\n      ? {\n          cash_used_for_build_TargetCurrency: null,\n"
          new = "    const financing = fxRate === null\n      ? {\n          financing_provenance: {\n            debt_fraction: input.financingPlan?.debt_fraction == null ? 'DEFAULT' as const : 'USER' as const,\n            equity_fraction: input.financingPlan?.equity_fraction == null ? 'DEFAULT' as const : 'USER' as const,\n            use_cash_first: input.financingPlan?.use_cash_first == null ? 'DEFAULT' as const : 'USER' as const,\n            cash_use_percent: input.financingPlan?.cash_use_percent == null ? 'DEFAULT' as const : 'USER' as const,\n            canonical_default_split_applied: input.financingPlan?.debt_fraction == null && input.financingPlan?.equity_fraction == null,\n          },\n          remaining_funding_need_TargetCurrency: null,\n          cash_used_for_build_TargetCurrency: null,\n"
          if old not in s:
              raise SystemExit('fallback anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install and build
        run: |
          npm install
          npm run test:corporate-financing
          npm run build
      - name: Commit and disable workflow
        shell: bash
        run: |
          printf '%s\n' 'name: Nightly Refresh (Disabled)' '' '# Scheduling handled by Vercel Cron (vercel.json).' 'on: []' '' 'jobs:' '  refresh:' '    runs-on: ubuntu-latest' '    steps:' '      - name: Workflow disabled' '        run: echo "Nightly refresh scheduling is handled by Vercel Cron."' > .github/workflows/nightly-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/snapshot/runCorporateSnapshot.ts .github/workflows/nightly-refresh.yml
          git commit -m 'Preserve financing provenance in snapshot fallbacks'
          git push origin HEAD:feature/corporate-pre-revenue-metrics
